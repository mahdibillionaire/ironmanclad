name: WebEngine Scheduled Automation

on:
  schedule:
    # 5 runs per day spaced across optimal US business hours (UTC):
    # - 13:00 UTC (09:00 AM EDT / 06:00 AM PDT)
    # - 16:00 UTC (12:00 PM EDT / 09:00 AM PDT)
    # - 18:00 UTC (02:00 PM EDT / 11:00 AM PDT)
    # - 20:00 UTC (04:00 PM EDT / 01:00 PM PDT)
    # - 22:00 UTC (06:00 PM EDT / 03:00 PM PDT)
    - cron: '0 13,16,18,20,22 * * 1-5'
  workflow_dispatch:
    inputs:
      target_query:
        description: 'Search Query Override (e.g., pmu artists in california)'
        required: false
        default: ''
      max_leads:
        description: 'Target Valid Leads'
        required: false
        default: '20'

jobs:
  run-engine:
    name: Execute Outreach Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 180

    # 🚀 CONTAINER EXECUTION LAYER (Pre-built GHCR image with Playwright, Python, Rclone, Xvfb)
    container:
      image: ghcr.io/mahdibillionaire/ironmanclad:latest
      options: --ipc=host
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Public Engine Repo
        uses: actions/checkout@v4

      # =========================================================================
      # ⚠️ FALLBACK NATIVE RUNNER SETUP (PRESERVED FOR INSTANT ROLLBACK)
      # If container pull is ever slower than native execution, comment out the
      # 'container:' block above and uncomment the 4 steps below:
      # =========================================================================
      # - name: Setup Node.js Runtime
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      # - name: Setup Python Environment
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.11'
      # - name: Install Rclone Cloud Client
      #   run: |
      #     sudo -v ; curl -fsSL https://rclone.org/install.sh | sudo bash
      #     rclone version
      # - name: Install System Packages, Xvfb & Playwright Browsers
      #   run: |
      #     sudo apt-get update && sudo apt-get install -y xvfb
      #     npm install
      #     npx playwright install --with-deps chromium

      - name: Configure Secure Cloud Storage Credentials
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG_DATA }}
        run: |
          if [ -z "$RCLONE_CONFIG_DATA" ]; then
            echo "::error ::RCLONE_CONFIG_DATA secret is not set in GitHub repository settings!"
            exit 1
          fi
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          echo "Rclone config armed successfully."

      - name: Synchronize Private Engine Payload from Google Drive
        run: |
          mkdir -p payload_sync
          echo "Pulling payload from Google Drive (Pmu Sniper)..."
          rclone copy gdrive: ./payload_sync --drive-acknowledge-abuse -v
          
          # Move payload files into working directory (force overwrite to guarantee fresh payload)
          cp -rf ./payload_sync/* . || true
          rm -rf payload_sync

          # Ensure .env is present (either from Drive or from GitHub Secrets fallback)
          if [ ! -f ".env" ] && [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "Injecting .env from repository secret..."
            echo "${{ secrets.ENV_FILE }}" > .env
          fi

      - name: Run WebEngine Worker
        env:
          OVERRIDE_TARGET_QUERY: ${{ inputs.target_query }}
          MAX_LEADS: ${{ inputs.max_leads }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          QEV_API_KEY: ${{ secrets.QEV_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          GOOGLE_EMAIL: ${{ secrets.GOOGLE_EMAIL }}
          GOOGLE_APP_PASSWORD: ${{ secrets.GOOGLE_APP_PASSWORD }}
          SCRAPER_EMAIL: ${{ secrets.SCRAPER_EMAIL }}
          SCRAPER_PASSWORD: ${{ secrets.SCRAPER_PASSWORD }}
          SCRAPER_EMAIL1: ${{ secrets.SCRAPER_EMAIL1 }}
          SCRAPER_PASSWORD1: ${{ secrets.SCRAPER_PASSWORD1 }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ ! -f "worker.ts" ]; then
            echo "::error ::worker.ts was not found after Google Drive synchronization. Check your Google Drive payload."
            exit 1
          fi
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" npx tsx worker.ts
          else
            npx tsx worker.ts
          fi

      - name: Synchronize Updated State Back to Google Drive
        if: always()
        run: |
          echo "Syncing state back to Google Drive (Pmu Sniper)..."
          rclone copy . gdrive: \
            --exclude "node_modules/**" \
            --exclude ".git/**" \
            --exclude ".github/**" \
            --drive-acknowledge-abuse || true
